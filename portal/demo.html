<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'; connect-src 'none'">
  <title>Portal demo · Harvard AI Group</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./portal.css">
  <link rel="stylesheet" href="./demo.css">
  <script type="module" src="./client/portal/demo.mjs"></script>
</head>
<body>
  <header><div class="shell header"><strong>Harvard AI Group</strong><span>Portal demo</span></div></header>
  <div class="demo-intro"><div class="shell">
    <p><strong>Fictional accounts.</strong> Changes stay in this tab and clear when you reload.</p>
    <div class="demo-switcher" role="group" aria-label="Demo account">
      <button type="button" data-account="member" aria-pressed="true">Member</button>
      <button type="button" data-account="board" aria-pressed="false">Board</button>
      <button type="button" data-account="owner" aria-pressed="false">Owner</button>
      <button type="button" id="reset">Reset demo</button>
    </div>
    <p class="demo-guide">Send a request as Member, switch to Board to review it, then try managing access as Owner.</p>
  </div></div>
  <main class="shell">
    <h1 id="workspace-title" tabindex="-1">Portal demo</h1>
    <p id="result" class="notice" role="status" hidden></p>
    <div id="workspace"></div>
    <noscript><p>Enable JavaScript to switch between the demo accounts.</p></noscript>
  </main>
  <footer class="shell"><a href="../">Public website</a></footer>
</body>
</html>
